      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PlacesRestApi}/*"

  PermissionAdminEditPOST:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LambdaPlacesAdminEditPlace.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PlacesRestApi}/*"

  # ------------------------------------------------------------
  # API GATEWAY DEPLOYMENT & STAGE
  # ------------------------------------------------------------
  PlacesApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MethodSearchGET
      - MethodPlaceGET
      - MethodSubmitPOST
      - MethodSubmitVerifyPOST
      - MethodSubmitAIAutofillPOST
      - MethodRatingsGET
      - MethodRatingsPOST
      - MethodClaimPOST
      - MethodReportPOST
      - MethodEditPlacePOST
      - MethodAdminReviewPOST
      - MethodAdminEditPOST
    Properties:
      RestApiId: !Ref PlacesRestApi
      Description: "Deployed by CloudFormation — prod"

  PlacesApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref PlacesRestApi
      DeploymentId: !Ref PlacesApiDeployment
      StageName: "Places_PROD"
      Description: "Places API Stage — prod"

# ==============================================================
# OUTPUTS
# ==============================================================
Outputs:

  PlacesApiId:
    Description: "API Gateway REST API ID"
    Value: !Ref PlacesRestApi
    Export:
      Name: "PlacesApiId"

  PlacesApiBaseUrl:
    Description: "Base URL for the Places API"
    Value: !Sub "https://${PlacesRestApi}.execute-api.${AWS::Region}.amazonaws.com/Places_PROD"
    Export:
      Name: "PlacesApiBaseUrl"

  LambdaRoleArn:
    Description: "Shared Lambda execution role ARN"
    Value: !GetAtt PlacesLambdaExecutionRole.Arn
    Export:
      Name: "PlacesLambdaExecutionRoleArn"