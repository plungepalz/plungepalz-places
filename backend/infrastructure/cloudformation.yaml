# PlungePalz Places API — CloudFormation
#
# The live stack is deployed as:
#   Stack Name: plungepalz-places-api-prod
#   Region:     us-east-2
#

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PlungePalz - Places REST API (PRODUCTION)
  Region: us-east-2
  Creates all API Gateway resources, methods, and Lambda functions
  for the Places API in one deployment.

# ==============================================================
# RESOURCES
# ==============================================================
Resources:

  # ------------------------------------------------------------
  # IAM ROLE — Shared Lambda Execution Role
  # ------------------------------------------------------------
  PlacesLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "PlacesLambdaExecutionRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PlacesDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Places_Places"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Places_Places/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Places_RatingsComments"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Places_RatingsComments/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Places_ClaimedAudit"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Places_ClaimedAudit/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Places_Submissions"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Places_Submissions/index/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - sns:Publish
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # ------------------------------------------------------------
  # LAMBDA FUNCTIONS
  # ------------------------------------------------------------

  # 1. Places_Search
  LambdaPlacesSearch:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "Places_Search"
      Description: "Search places by H3 hex, lat/lng, place_type, activity_types, and filters"
      Runtime: python3.14
      Handler: index.handler
      Role: !GetAtt PlacesLambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: "prod"
          TABLE_PLACES: "Places_Places"
      Code:
        ZipFile: |
          import json

          def handler(event, context):
              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json", "Access-Control-Allow-Origin": "*"},
                  "body": json.dumps({"message": "Places_Search placeholder — not yet implemented"})
              }

