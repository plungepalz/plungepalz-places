  # ------------------------------------------------------------
  # API GATEWAY — REST API
  # ------------------------------------------------------------
  PlacesRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: "Places"
      Description: PlungePalz Places REST API
      EndpointConfiguration:
        Types:
          - REGIONAL

  # ------------------------------------------------------------
  # RESOURCES — /search
  # ------------------------------------------------------------
  ResourceSearch:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PlacesRestApi
      ParentId: !GetAtt PlacesRestApi.RootResourceId
      PathPart: search

  MethodSearchGET:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PlacesRestApi
      ResourceId: !Ref ResourceSearch
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations"
          - LambdaArn: !GetAtt LambdaPlacesSearch.Arn

  # ------------------------------------------------------------
  # RESOURCES — /place/{place_id}
